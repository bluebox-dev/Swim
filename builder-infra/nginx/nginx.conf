# Large downloads (install images, WinPE) all go through the internal /storage/ location.
# At most SWIM_MAX_DOWNLOADS (4) run at once, each capped in speed, so many machines
# reimaging or pre-staging together cannot saturate the server's disk or uplink. Extra
# requests get 503 and the agent waits its turn (agent ≥ 0.5.20).
limit_conn_zone $server_name zone=swim_downloads:1m;

# Sign-in and enrollment are the only endpoints an outsider can hammer: 5 requests a second
# per address (short bursts allowed). Everything else needs a session or a host token first.
limit_req_zone $binary_remote_addr zone=swim_auth:10m rate=5r/s;

server_tokens off;   # do not advertise the nginx version

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_session_tickets off;

    # Browser protections for every answer of this server (locations that set their own
    # headers repeat them through security-headers.inc — nginx does not inherit otherwise).
    include /etc/nginx/conf.d/security-headers.inc;

    client_max_body_size 50m;
    root /usr/share/nginx/html;

    location ^~ /v1/auth/ {
        limit_req zone=swim_auth burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /v1/agent/enroll {
        limit_req zone=swim_auth burst=40 nodelay;   # a room of machines enrolling at once is fine
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Agent remote tunnel: an upgraded, long-lived byte stream (api/tunnel.go)
    location ^~ /v1/agent/tunnel/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        access_log off;
    }

    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;   # long-poll /agent/commands?wait=55
    }

    # Large files: backend authorises, then answers with X-Accel-Redirect: /storage/...
    location ^~ /storage/ {
        internal;
        alias /storage/;
        limit_conn swim_downloads 4;
        limit_conn_status 503;
        limit_rate 40m;              # bytes/s per download (~320 Mbit/s); 4 × = ~1.3 Gbit/s at most
        sendfile on;
        tcp_nopush on;
    }

    # VM consoles (Guacamole). WebSocket tunnel + long sessions.
    location ^~ /guacamole/ {
        proxy_pass http://127.0.0.1:8080/guacamole/;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
        access_log off;
    }

    # Public agent downloads: binaries, latest.json, install.ps1. Nothing secret lives here —
    # the enrollment token is in the admin-generated command, never in these files.
    location ^~ /dl/agent/ {
        alias /storage/agent/;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
        default_type application/octet-stream;
        types { application/json json; text/plain ps1; }
    }

    location = /metrics { return 404; }

    # SWIM UI files: revalidate every load so a redeploy shows up immediately; fonts never change.
    # The prefix locations above use ^~ so this regex never captures /guacamole/ or /v1/ assets.
    location ~* \.(?:css|js|html)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        include /etc/nginx/conf.d/security-headers-ui.inc;
        add_header Cache-Control "no-cache";
    }
    location /fonts/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # nothing under a dot-name is ever served (.env, .git …), even by mistake
    location ~ /\. { return 404; }

    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        include /etc/nginx/conf.d/security-headers-ui.inc;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
